<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0e0d0b"><title>Distill</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" referrerpolicy="no-referrer">
<style>
:root{--ink:#0e0d0b;--panel:#17150f;--line:#2c281d;--text:#efe8d8;--muted:#a39a83;--gold:#e3b448;--ok:#63c27d;--warn:#e3b448;--bad:#e0705f;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}body{margin:0;background:var(--ink);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
h1{font-size:22px;margin:4px 0;color:var(--gold)}.sub{color:var(--muted);font-size:13px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px}
button{font:inherit;color:inherit}
.btn{padding:12px 16px;border-radius:12px;border:0;background:var(--gold);color:#16120a;font-weight:700;font-size:16px;cursor:pointer}
#lock{margin-top:28vh;display:grid;gap:10px}label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.err{color:var(--bad)}
.tabs{display:flex;gap:6px;margin:6px 0 10px}.tab{flex:1;padding:9px 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px;cursor:pointer}
.tab.on{border-color:var(--gold);color:var(--gold)}
.top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.flame{color:var(--gold);font-weight:700}
.bars{display:flex;gap:4px;margin:8px 0 10px}.bars span{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}.bars i{display:block;height:100%;width:0;background:var(--gold)}
#today{flex:1;display:flex;flex-direction:column;min-height:0}
.card{flex:1;min-height:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;touch-action:pan-y;user-select:none}
.card.fly{transition:transform .3s ease-out,opacity .3s}
.kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
.big{font-size:22px;line-height:1.25;font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
.body{font-size:15px;overflow-wrap:anywhere}
.ringrow{display:flex;gap:14px;align-items:center}
.ring{flex:none;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:70px;height:70px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:24px;font-weight:800}
.why{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px;overflow-wrap:anywhere}
.claim{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px;overflow-wrap:anywhere}
.tapzones{position:absolute;inset:0;display:grid;grid-template-columns:1fr 2fr}.tapzones button{background:none;border:0;cursor:pointer}
.hint{margin-top:auto;font-size:11px;color:var(--muted);text-align:center}
.opts{display:grid;gap:8px}.opt{text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink);font-weight:600;cursor:pointer}
.opt.right{border-color:var(--ok);color:var(--ok)}.opt.wrong{border-color:var(--bad);color:var(--bad)}
.feedback{min-height:1.5em;font-size:14px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.act{padding:13px 4px;border-radius:12px;border:1px solid var(--line);background:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.act.keep{border-color:var(--ok)}.act.later{border-color:var(--gold)}
.stamp{position:absolute;top:16px;padding:4px 10px;border:2px solid;border-radius:8px;font-weight:800;opacity:0}
.stamp.keep{left:16px;color:var(--ok);transform:rotate(-10deg)}.stamp.got{right:16px;color:var(--muted);transform:rotate(10deg)}
.center{justify-content:center;align-items:center;text-align:center}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.item h2{font-size:16px;margin:0 0 4px;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:13px}
.trust{float:right;font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;margin-left:8px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.more{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.item.open .more{display:block}
.more h3{font-size:14px;color:var(--gold);margin:12px 0 4px}.more ul,.more ol{margin:4px 0;padding-left:20px}
a{color:var(--gold);word-break:break-all}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;cursor:pointer}.chip.on{border-color:var(--gold);color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card.fly{transition:none}}
/* Morning: one column, read top to bottom; a sunrise bar fills as you read */
#morning{--disp:"Bricolage Grotesque",system-ui,sans-serif;--serif:"Literata",Georgia,serif;--okbg:#173a2a;--buzzbg:#3a2f14;display:grid;gap:26px;padding-bottom:30px;font-family:var(--serif);font-size:17px;line-height:1.55}
#morning h1,#morning h2,#morning h3{font-family:var(--disp);text-wrap:balance;margin:0;line-height:1.15;overflow-wrap:anywhere}
.mo-bar{position:sticky;top:env(safe-area-inset-top,0px);height:4px;background:var(--line);z-index:5;margin-bottom:-22px}.mo-bar i{display:block;height:100%;width:0;background:var(--gold)}
.mo-lbl{font:500 12px ui-monospace,"Cascadia Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mo-head{display:grid;gap:6px}.mo-head h1{font-size:32px;font-weight:800;color:var(--text)}.mo-head p{margin:0;color:var(--muted)}
.mo-count{font:13px ui-monospace,"Cascadia Mono",monospace;background:var(--buzzbg);padding:6px 10px;border-radius:6px;justify-self:start}
.mo-sec{display:grid;gap:14px}.mo-sec>h2{font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mo-lead,.mo-save,.mo-quiz{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px}
.mo-lead h3{font-size:24px;font-weight:800}
.mo-why{margin:0}.mo-why b{font-family:var(--disp);color:var(--gold)}
.mo-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:13px ui-monospace,"Cascadia Mono",monospace;color:var(--muted)}
.mo-meta a{color:var(--muted)}
.mo-pill{font:11px ui-monospace,"Cascadia Mono",monospace;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px}
.mo-pill.ok{background:var(--okbg);color:var(--ok)}.mo-pill.buzz{background:var(--buzzbg);color:var(--gold)}
.mo-tag{font:11px ui-monospace,"Cascadia Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
.mo-need{list-style:none;margin:0;padding:0;counter-reset:n}
.mo-need li{counter-increment:n;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.mo-need li::before{content:counter(n);font:800 24px/1.1 var(--disp);color:var(--gold)}
.mo-need li>div{display:grid;gap:6px}.mo-need h3{font-size:18px;font-weight:700}
.mo-save h3{font-size:17px}.mo-try{margin:0;font-size:15px}.mo-try b{font-family:var(--disp);color:var(--ok)}
#morning details{border-top:1px solid var(--line);padding:12px 0}#morning summary{cursor:pointer;font-family:var(--disp);font-weight:700}
#morning details ul{margin:10px 0 0;padding-left:18px;display:grid;gap:8px;font-size:15px}
.mo-done{text-align:center;display:grid;gap:6px;padding:16px 0}.mo-done b{font:800 26px var(--disp)}
</style></head><body><main>
<section id="lock"><h1>Distill</h1><div class="sub">Your library is locked.</div>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<label><input id="remember" type="checkbox" style="width:auto"> Remember on this phone</label>
<button class="btn" id="open">Open</button><div id="err" class="err"></div></section>
<section id="app" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
  <nav class="tabs"><button class="tab" data-tab="morning" hidden>Morning</button><button class="tab on" data-tab="today">Today</button><button class="tab" data-tab="kept">Kept</button><button class="tab" data-tab="library">Library</button></nav>
  <div id="morning" hidden></div>
  <div id="today"></div>
  <div id="kept" hidden></div>
  <div id="library" hidden><input id="q" type="search" placeholder="Search your library"><div class="chips" id="chips"></div><div class="sub" id="count"></div><div id="list"></div></div>
</section>
</main>

<script>
const STAMP = "25 Oct 2026, 17:04", ITER = 250000;
/*LOGIC*/
function addDays(iso, n) { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function pickDeck(items, state, today, size = 5) {
  const s = (id) => (state.cards || {})[id];
  const fresh = items.filter((i) => !s(i.id)).sort((a, b) => (b.added || "").localeCompare(a.added || ""));
  const due = items.filter((i) => s(i.id) && s(i.id).due && s(i.id).due <= today && s(i.id).last !== today)
    .sort((a, b) => s(a.id).due.localeCompare(s(b.id).due));
  return [...fresh, ...due].slice(0, size);
}
const LADDER = [1, 3, 7];
function afterSwipe(entry, how, quizRight, today) {
  const e = { ...(entry || {}), last: today };
  if (how === "keep") { e.kept = true; e.due = addDays(today, 3); }
  else if (how === "got") { e.due = addDays(today, 7); }
  else { const box = Math.min(e.box || 0, LADDER.length - 1); e.due = addDays(today, LADDER[box]); e.box = (e.box || 0) + 1; }
  if (quizRight === false) e.due = addDays(today, 1);
  return e;
}
function isWeekend(iso) { const d = new Date(iso + "T00:00:00Z").getUTCDay(); return d === 0 || d === 6; }
function streakAfter(state, today) {
  const last = state.lastDone, s = state.streak || 0;
  if (!last) return { streak: 1, lastDone: today };
  if (last === today) return { streak: s, lastDone: today };
  let d = addDays(today, -1);
  while (d > last) { if (!isWeekend(d)) return { streak: 1, lastDone: today }; d = addDays(d, -1); }
  return { streak: s + 1, lastDone: today };
}

let today = new Date().toLocaleDateString("en-CA");
// Phones resume tabs without reloading: past midnight, start a fresh day's deck.
document.addEventListener("visibilitychange", () => {
  const now = new Date().toLocaleDateString("en-CA");
  if (document.visibilityState === "visible" && now !== today && items.length) {
    today = now; deck = pickDeck(items, store, today); di = 0; si = 0; phase = "story"; quizRight = null; renderToday();
  }
});
const KEY = "distill_today_v1";
let store = { cards: {}, streak: 0, lastDone: null };
try { store = Object.assign(store, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} };
let items = [], deck = [], di = 0, si = 0, phase = "story", quizRight = null;

async function unseal(pw) {
  const raw = Uint8Array.from(atob($("#sealed").textContent.trim()), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: raw.slice(0, 16), iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(16, 28) }, key, raw.slice(28))));
}
const tone = (t) => t >= 65 ? "ok" : t >= 40 ? "warn" : "bad";
const toneVar = (t) => `var(--${tone(t)})`;
const intent = (cp) => ({ teach: "to teach", sell: "to sell", engagement: "for engagement" })[cp && cp.intent] || "for unclear reasons";

/* ---------- Today ---------- */
function bars(n, filled) { const b = el("div", "bars"); for (let i = 0; i < n; i++) { const s = el("span"), f = el("i"); f.style.width = i < filled ? "100%" : "0"; s.append(f); b.append(s); } return b; }
function header() {
  const t = el("div", "top");
  // A streak broken by a missed weekday shows as gone, not as yesterday's number.
  const alive = store.lastDone === today || streakAfter(store, today).streak > 1, n = alive ? store.streak : 0;
  t.append(el("span", null, phase === "done" || !deck.length ? "Today" : `Today · card ${di + 1} of ${deck.length}`),
           el("span", "flame", n ? `🔥 ${n} day${n > 1 ? "s" : ""}` : ""));
  return t;
}
function slides(c) { return c.steps && c.steps.length ? 4 : 3; }
function storyCard(c) {
  const card = el("div", "card"), n = slides(c), claimsSlide = n - 1;
  if (si === 0) {
    card.append(el("div", "kicker", c.compass ? `${c.space} · made ${intent(c.compass)}` : c.space), el("div", "big", c.one_liner || c.title || ""));
    if (c.compass) {
      const row = el("div", "ringrow"), ring = el("div", "ring"), inner = el("div", null, String(c.compass.trust));
      ring.style.setProperty("--p", c.compass.trust); ring.style.setProperty("--c", toneVar(c.compass.trust)); ring.append(inner);
      const side = el("div"); side.append(el("div", "kicker", `trust ± ${c.compass.band}`));
      const ul = el("ul", "why"); (c.compass.because || []).slice(0, 2).forEach((b) => ul.append(el("li", null, b))); side.append(ul);
      row.append(ring, side); card.append(row);
    }
  } else if (si === 1) {
    card.append(el("div", "kicker", "The one idea"), el("div", "big", c.idea || c.one_liner || ""));
  } else if (si === 2 && n === 4) {
    card.append(el("div", "kicker", "Try it")); const ol = el("ol", "steps"); c.steps.slice(0, 5).forEach((s) => ol.append(el("li", null, s))); card.append(ol);
  } else {
    const cl = c.claims || [], ok = cl.filter((x) => x.verdict === "verified").length;
    card.append(el("div", "kicker", cl.length ? `What it claims · ${ok} of ${cl.length} check out` : "What it claims"));
    if (!cl.length) card.append(el("div", "body", "No checkable claims in this one."));
    cl.slice(0, 5).forEach((x) => { const r = el("div", "claim"); r.append(el("span", null, MARK[x.verdict] || "✗"), el("span", null, x.claim)); card.append(r); });
  }
  card.append(el("div", "hint", si < n - 1 ? "tap the right side →" : (c.quiz != null ? "tap → quick check" : "tap → file it")));
  const tz = el("div", "tapzones"), back = el("button"), next = el("button");
  back.setAttribute("aria-label", "Back"); next.setAttribute("aria-label", "Next");
  back.onclick = () => { if (si > 0) { si--; renderToday(); } };
  next.onclick = () => { if (si < n - 1) si++; else phase = c.quiz != null ? "quiz" : "swipe"; renderToday(); };
  tz.append(back, next); card.append(tz);
  return [bars(n, si + 1), card];
}
function quizCard(c) {
  const q = c.claims[c.quiz], card = el("div", "card");
  card.append(el("div", "kicker", "Quick check"), el("div", "big", `“${q.claim || "(this reel's main claim)"}”`), el("div", "body", "Did this claim check out?"));
  const opts = el("div", "opts"), fb = el("div", "feedback");
  ["verified", "partial", "unverified"].forEach((v) => {
    const b = el("button", "opt", `${MARK[v]}  ${WORD[v]}`);
    b.onclick = () => {
      if (quizRight !== null) return;
      quizRight = v === q.verdict; b.classList.add(quizRight ? "right" : "wrong");
      if (!quizRight) [...opts.children][["verified", "partial", "unverified"].indexOf(q.verdict)].classList.add("right");
      fb.textContent = quizRight ? "Right. That's how you spot hype." : `It was: ${WORD[q.verdict].toLowerCase()}. It'll come back tomorrow.`;
      setTimeout(() => { phase = "swipe"; renderToday(); }, 1200);
    };
    opts.append(b);
  });

  return [bars(1, 1), card];
}
function swipeCard(c) {
  const card = el("div", "card"), sk = el("div", "stamp keep", "KEEP"), sg = el("div", "stamp got", "GOT IT");
  card.append(sk, sg, el("div", "kicker", "File it"), el("div", "big", c.one_liner || c.title || ""),
    el("div", "body", "Swipe right to keep it for later, left if you've got it. Or bring it back for another quick check."));
  const acts = el("div", "actions");
  [["got", "← Got it"], ["later", "↑ Again later"], ["keep", "Keep →"]].forEach(([k, label]) => { const b = el("button", "act " + k, label); b.onclick = () => fly(card, c, k); acts.append(b); });
  card.append(acts);
  let x0 = null, dx = 0;
  card.addEventListener("pointerdown", (e) => { if (e.target.closest("button")) return; x0 = e.clientX; card.setPointerCapture(e.pointerId); });
  card.addEventListener("pointermove", (e) => { if (x0 === null) return; dx = e.clientX - x0; card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; sk.style.opacity = Math.max(0, dx / 90); sg.style.opacity = Math.max(0, -dx / 90); });
  card.addEventListener("pointerup", () => { if (x0 === null) return; x0 = null; if (Math.abs(dx) > 90) fly(card, c, dx > 0 ? "keep" : "got"); else { card.style.transform = ""; sk.style.opacity = sg.style.opacity = 0; } dx = 0; });
  // Android turns a slightly diagonal drag into a scroll and cancels the pointer: snap the card back.
  card.addEventListener("pointercancel", () => { x0 = null; dx = 0; card.style.transform = ""; sk.style.opacity = sg.style.opacity = 0; });
  return [bars(1, 1), card];
}
function fly(card, c, how) {
  if (card.dataset.flown) return;  // a double tap or swipe + tap must file the card once, not skip the next one
  card.dataset.flown = "1";
  store.cards[c.id] = afterSwipe(store.cards[c.id], how, c.quiz != null ? quizRight : null, today); save();
  card.classList.add("fly");
  card.style.transform = how === "keep" ? "translateX(140%) rotate(18deg)" : how === "got" ? "translateX(-140%) rotate(-18deg)" : "translateY(-130%)";
  card.style.opacity = "0";
  setTimeout(() => { di++; si = 0; quizRight = null; if (di >= deck.length) { Object.assign(store, streakAfter(store, today)); save(); phase = "done"; } else phase = "story"; renderToday(); }, 280);
}
function doneCard() {
  const card = el("div", "card center"), back = Object.values(store.cards).filter((x) => x.due === addDays(today, 1)).length;
  card.append(el("div", "big", deck.length ? "Deck done 🔥" : "All caught up 🔥"),
    el("div", "body", deck.length ? `${store.streak} day${store.streak > 1 ? "s" : ""} in a row.${back ? ` ${back} card${back > 1 ? "s come" : " comes"} back tomorrow for a quick check.` : ""}`
                                  : "Nothing new or due today. Forward a reel to the bot and it shows up here."));
  const lib = el("button", "act keep", "Browse the library"); lib.onclick = () => showTab("library"); card.append(lib);
  return [card];
}
function renderToday() {
  const box = $("#today"); box.replaceChildren(header());
  if (!deck.length || phase === "done") { box.append(...doneCard()); return; }
  const c = deck[di];
  box.append(...(phase === "story" ? storyCard(c) : phase === "quiz" ? quizCard(c) : swipeCard(c)));
}

/* ---------- Library + Kept ---------- */
let space = "All";
function itemBox(i) {
  const box = el("div", "item");
  if (i.compass) box.append(el("span", "trust " + tone(i.compass.trust), `trust ${i.compass.trust} ± ${i.compass.band}`));
  box.append(el("h2", null, i.one_liner || i.title || ""), el("div", "meta", `${i.space} · ${(i.added || "").slice(0, 10)}`));
  const more = el("div", "more");
  if (i.summary) more.append(el("p", null, i.summary));
  if (i.note) more.append(el("p", "meta", i.note));
  if ((i.claims || []).length) {
    const ok = i.claims.filter((c) => c.verdict === "verified").length;
    more.append(el("h3", null, `What it claims: ${ok} of ${i.claims.length} check out`));
    const ul = el("ul"); i.claims.forEach((c) => ul.append(el("li", null, `${MARK[c.verdict] || "✗"} ${c.claim}`))); more.append(ul);
  }
  if (i.compass) { more.append(el("h3", null, `🧭 Made ${intent(i.compass)}${i.compass.mixed ? " (mixed motives)" : ""}`)); const ul = el("ul"); (i.compass.because || []).forEach((b) => ul.append(el("li", null, b))); more.append(ul); }
  if ((i.steps || []).length) { more.append(el("h3", null, "Steps")); const ol = el("ol"); i.steps.forEach((s) => ol.append(el("li", null, s))); more.append(ol); }
  const links = (i.tools || []).filter((t) => safe(t.url));
  if (links.length) { more.append(el("h3", null, "Links")); const ul = el("ul"); links.forEach((t) => { const li = el("li"), a = el("a", null, t.name); a.href = safe(t.url); a.target = "_blank"; a.rel = "noopener"; li.append(a); ul.append(li); }); more.append(ul); }
  if (i.next_time) more.append(el("p", null, "Next time: " + i.next_time));
  if (safe(i.url)) { const a = el("a", null, "Open the original"); a.href = safe(i.url); a.target = "_blank"; a.rel = "noopener"; more.append(a); }
  box.append(more);
  box.addEventListener("click", (e) => { if (e.target.tagName !== "A") box.classList.toggle("open"); });
  return box;
}
function renderLibrary() {
  const q = $("#q").value.toLowerCase(), list = $("#list"); list.replaceChildren();
  const shown = items.filter((i) => (space === "All" || i.space === space) &&
    (!q || JSON.stringify([i.title, i.one_liner, i.summary, i.space, i.steps, (i.tools || []).map((t) => t.name)]).toLowerCase().includes(q)));
  $("#count").textContent = `${shown.length} of ${items.length} cards · updated ${STAMP}`;
  shown.forEach((i) => list.append(itemBox(i)));
}
function chips() {
  const c = $("#chips"); c.replaceChildren();
  ["All", ...new Set(items.map((i) => i.space))].forEach((n) => { const b = el("button", "chip" + (n === space ? " on" : ""), n); b.onclick = () => { space = n; chips(); renderLibrary(); }; c.append(b); });
}
function renderKept() {
  const box = $("#kept"); box.replaceChildren();
  const kept = items.filter((i) => (store.cards[i.id] || {}).kept);
  box.append(el("div", "sub", kept.length ? `${kept.length} card${kept.length > 1 ? "s" : ""} you kept to try` : "Swipe a card right in Today to keep it here."));
  kept.forEach((i) => box.append(itemBox(i)));
}
/* ---------- Morning ---------- */
let morning = null;
function sources(c) {
  const m = el("div", "mo-meta");
  m.append(el("span", "mo-pill " + (c.confirmed ? "ok" : "buzz"), c.confirmed ? "confirmed" : "buzz"));
  (c.sources || []).forEach((s) => { const u = safe(s.link); if (!u) { m.append(el("span", null, s.name)); return; } const a = el("a", null, s.name); a.href = u; a.target = "_blank"; a.rel = "noopener"; m.append(a); });
  return m;
}
function why(text, label = "Why it matters:", cls = "mo-why") { const p = el("p", cls); p.append(el("b", null, label + " "), document.createTextNode(text || "")); return p; }
function sec(title, note) { const s = el("section", "mo-sec"), h = el("h2", null, title); if (note) h.append(el("span", "mo-lbl", note)); s.append(h); return s; }
function renderMorning() {
  const m = morning, box = $("#morning"); box.replaceChildren();
  const bar = el("div", "mo-bar"); bar.append(el("i")); box.append(bar);
  const day = new Date(m.day + "T00:00:00").toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" });
  const head = el("header", "mo-head"), need = m.need || [], saves = m.saves || [];
  head.append(el("span", "mo-lbl", day), el("h1", null, m.day === today ? "Good morning" : `${day.split(",")[0]}'s briefing`),
    el("p", null, `${m.minutes || 4} minute read. Everything else can wait.`),
    el("span", "mo-count", `${m.read || 0} headlines read for you → ${(m.lead ? 1 : 0) + need.length + saves.length} that matter`));
  box.append(head);
  if (m.lead) {
    const s = sec("The big one"), a = el("article", "mo-lead");
    a.append(el("span", "mo-tag", m.lead.topic), el("h3", null, m.lead.what), why(m.lead.why), sources(m.lead)); s.append(a); box.append(s);
  }
  if (need.length) {
    const s = sec("Need to know", `${need.length} · ${Math.max(1, Math.round(need.length * 0.4))} min`), ol = el("ol", "mo-need");
    need.forEach((c) => { const li = el("li"), d = el("div"); d.append(el("span", "mo-tag", c.topic), el("h3", null, c.what), why(c.why), sources(c)); li.append(d); ol.append(li); });
    s.append(ol); box.append(s);
  }
  if (saves.length) {
    const s = sec("From your saves", `${saves.length} · 1 min`);
    saves.forEach((v) => { const d = el("div", "mo-save"); d.append(el("span", "mo-tag", v.space), el("h3", null, v.text)); if (v.try) d.append(why(v.try, "Try:", "mo-try")); s.append(d); });
    const go = el("button", "act keep", "Open in Today deck →"); go.onclick = () => showTab("today"); s.append(go); box.append(s);
  }
  if ((m.nice || []).length || (m.buzz || []).length) {
    const s = sec("Nice to know", "tap to open");
    [["Confirmed, lower stakes", m.nice || []], ["Buzz, not verified yet", m.buzz || []]].forEach(([t, list]) => {
      if (!list.length) return;
      const d = el("details"), ul = el("ul"); d.append(el("summary", null, `${t} (${list.length})`));
      list.forEach((c) => { const li = el("li", null, c.what + " "); li.append(el("span", "mo-lbl", (c.sources || []).map((x) => x.name).join(" · "))); ul.append(li); });
      d.append(ul); s.append(d);
    });
    box.append(s);
  }
  if (m.quiz) {
    const s = sec("One question", "10 sec"), q = el("div", "mo-quiz"), fb = el("div", "feedback");
    q.append(el("div", "body", `Which tool fills the blank? “${m.quiz.q}”`));
    const opts = el("div", "opts");
    m.quiz.options.forEach((o) => {
      const b = el("button", "opt", o);
      b.onclick = () => {
        if (opts.dataset.done) return; opts.dataset.done = "1";
        [...opts.children].forEach((x) => { if (x.textContent === m.quiz.answer) x.classList.add("right"); });
        if (o !== m.quiz.answer) b.classList.add("wrong");
        fb.textContent = o === m.quiz.answer ? "Right. It came from a reel you saved." : `It's ${m.quiz.answer}. It came from a reel you saved.`;
      };
      opts.append(b);
    });
    q.append(opts, fb); s.append(q); box.append(s);
  }
  const done = el("div", "mo-done"); done.append(el("b", null, "You're caught up ☀"), el("span", "mo-lbl", "Next one tomorrow at 7:00")); box.append(done);
  readBar();
}
function readBar() {
  const i = document.querySelector(".mo-bar i"); if (!i || $("#morning").hidden) return;
  const h = document.documentElement, max = h.scrollHeight - h.clientHeight;
  i.style.width = (max > 0 ? Math.min(100, h.scrollTop / max * 100) : 100) + "%";
}
addEventListener("scroll", readBar, { passive: true });
function showTab(name) {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.tab === name));
  ["morning", "today", "kept", "library"].forEach((n) => { $("#" + n).hidden = n !== name; });
  if (name === "kept") renderKept();
  if (name === "morning") readBar();
}
document.querySelectorAll(".tab").forEach((t) => { t.onclick = () => showTab(t.dataset.tab); });

async function open(pw, remember) {
  try {
    const data = await unseal(pw);
    items = Array.isArray(data) ? data : data.items || [];  // older pages sealed a bare list
    morning = Array.isArray(data) ? null : data.morning || null;
  } catch { $("#err").textContent = "That password didn't open it."; try { localStorage.removeItem("distill_pw"); } catch {} return; }
  // Only a failed unseal means a wrong password; a drawing problem must never wipe the saved one.
  try { remember ? localStorage.setItem("distill_pw", pw) : localStorage.removeItem("distill_pw"); } catch {}
  $("#lock").hidden = true; $("#app").hidden = false;
  deck = pickDeck(items, store, today); di = 0; si = 0; phase = "story";
  renderToday(); chips(); renderLibrary();
  if (morning) { $('[data-tab="morning"]').hidden = false; renderMorning(); if (new URLSearchParams(location.search).get("view") === "morning") showTab("morning"); }
}
$("#open").onclick = () => open($("#pw").value, $("#remember").checked);
$("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#open").click(); });
$("#q").addEventListener("input", renderLibrary);
try { const saved = localStorage.getItem("distill_pw"); if (saved) open(saved, true); } catch {}
