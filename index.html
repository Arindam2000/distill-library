<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0e0d0b"><title>Distill</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" referrerpolicy="no-referrer">
<style>
:root{--ink:#0e0d0b;--panel:#17150f;--line:#2c281d;--text:#efe8d8;--muted:#a39a83;--gold:#e3b448;--ok:#63c27d;--warn:#e3b448;--bad:#e0705f;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}body{margin:0;background:var(--ink);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
h1{font-size:22px;margin:4px 0;color:var(--gold)}.sub{color:var(--muted);font-size:13px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px}
button{font:inherit;color:inherit}
.btn{padding:12px 16px;border-radius:12px;border:0;background:var(--gold);color:#16120a;font-weight:700;font-size:16px;cursor:pointer}
#lock{margin-top:28vh;display:grid;gap:10px}label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.err{color:var(--bad)}
.tabs{display:flex;gap:6px;margin:6px 0 10px}.tab{flex:1;padding:9px 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px;cursor:pointer}
.tab.on{border-color:var(--gold);color:var(--gold)}
.top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.flame{color:var(--gold);font-weight:700}
.bars{display:flex;gap:4px;margin:8px 0 10px}.bars span{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}.bars i{display:block;height:100%;width:0;background:var(--gold)}
#today{flex:1;display:flex;flex-direction:column;min-height:0}
.card{flex:1;min-height:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;touch-action:pan-y;user-select:none}
.card.fly{transition:transform .3s ease-out,opacity .3s}
.kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
.big{font-size:22px;line-height:1.25;font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
.body{font-size:15px;overflow-wrap:anywhere}
.ringrow{display:flex;gap:14px;align-items:center}
.ring{flex:none;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:70px;height:70px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:24px;font-weight:800}
.why{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px;overflow-wrap:anywhere}
.claim{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px;overflow-wrap:anywhere}
.tapzones{position:absolute;inset:0;display:grid;grid-template-columns:1fr 2fr}.tapzones button{background:none;border:0;cursor:pointer}
.hint{margin-top:auto;font-size:11px;color:var(--muted);text-align:center}
.opts{display:grid;gap:8px}.opt{text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink);font-weight:600;cursor:pointer}
.opt.right{border-color:var(--ok);color:var(--ok)}.opt.wrong{border-color:var(--bad);color:var(--bad)}
.feedback{min-height:1.5em;font-size:14px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.act{padding:13px 4px;border-radius:12px;border:1px solid var(--line);background:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.act.keep{border-color:var(--ok)}.act.later{border-color:var(--gold)}
.stamp{position:absolute;top:16px;padding:4px 10px;border:2px solid;border-radius:8px;font-weight:800;opacity:0}
.stamp.keep{left:16px;color:var(--ok);transform:rotate(-10deg)}.stamp.got{right:16px;color:var(--muted);transform:rotate(10deg)}
.center{justify-content:center;align-items:center;text-align:center}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.item h2{font-size:16px;margin:0 0 4px;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:13px}
.trust{float:right;font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;margin-left:8px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.more{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.item.open .more{display:block}
.more h3{font-size:14px;color:var(--gold);margin:12px 0 4px}.more ul,.more ol{margin:4px 0;padding-left:20px}
a{color:var(--gold);word-break:break-all}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;cursor:pointer}.chip.on{border-color:var(--gold);color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card.fly{transition:none}}
/* Morning: one column, read top to bottom; a sunrise bar fills as you read */
#morning{--disp:"Bricolage Grotesque",system-ui,sans-serif;--serif:"Literata",Georgia,serif;--okbg:#173a2a;--buzzbg:#3a2f14;display:grid;gap:26px;padding-bottom:30px;font-family:var(--serif);font-size:17px;line-height:1.55}
#morning h1,#morning h2,#morning h3{font-family:var(--disp);text-wrap:balance;margin:0;line-height:1.15;overflow-wrap:anywhere}
.mo-bar{position:sticky;top:env(safe-area-inset-top,0px);height:4px;background:var(--line);z-index:5;margin-bottom:-22px}.mo-bar i{display:block;height:100%;width:0;background:var(--gold)}
.mo-lbl{font:500 12px ui-monospace,"Cascadia Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mo-head{display:grid;gap:6px}.mo-head h1{font-size:32px;font-weight:800;color:var(--text)}.mo-head p{margin:0;color:var(--muted)}
.mo-count{font:13px ui-monospace,"Cascadia Mono",monospace;background:var(--buzzbg);padding:6px 10px;border-radius:6px;justify-self:start}
.mo-sec{display:grid;gap:14px}.mo-sec>h2{font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mo-lead,.mo-save,.mo-quiz{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px}
.mo-lead h3{font-size:24px;font-weight:800}
.mo-why{margin:0}.mo-why b{font-family:var(--disp);color:var(--gold)}
.mo-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:13px ui-monospace,"Cascadia Mono",monospace;color:var(--muted)}
.mo-meta a{color:var(--muted)}
.mo-pill{font:11px ui-monospace,"Cascadia Mono",monospace;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px}
.mo-pill.ok{background:var(--okbg);color:var(--ok)}.mo-pill.buzz{background:var(--buzzbg);color:var(--gold)}
.mo-tag{font:11px ui-monospace,"Cascadia Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
.mo-need{list-style:none;margin:0;padding:0;counter-reset:n}
.mo-need li{counter-increment:n;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.mo-need li::before{content:counter(n);font:800 24px/1.1 var(--disp);color:var(--gold)}
.mo-need li>div{display:grid;gap:6px}.mo-need h3{font-size:18px;font-weight:700}
.mo-save h3{font-size:17px}.mo-try{margin:0;font-size:15px}.mo-try b{font-family:var(--disp);color:var(--ok)}
#morning details{border-top:1px solid var(--line);padding:12px 0}#morning summary{cursor:pointer;font-family:var(--disp);font-weight:700}
#morning details ul{margin:10px 0 0;padding-left:18px;display:grid;gap:8px;font-size:15px}
.mo-done{text-align:center;display:grid;gap:6px;padding:16px 0}.mo-done b{font:800 26px var(--disp)}
</style></head><body><main>
<section id="lock"><h1>Distill</h1><div class="sub">Your library is locked.</div>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<label><input id="remember" type="checkbox" style="width:auto"> Remember on this phone</label>
<button class="btn" id="open">Open</button><div id="err" class="err"></div></section>
<section id="app" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
  <nav class="tabs"><button class="tab" data-tab="morning" hidden>Morning</button><button class="tab on" data-tab="today">Today</button><button class="tab" data-tab="kept">Kept</button><button class="tab" data-tab="library">Library</button></nav>
  <div id="morning" hidden></div>
  <div id="today"></div>
  <div id="kept" hidden></div>
  <div id="library" hidden><input id="q" type="search" placeholder="Search your library"><div class="chips" id="chips"></div><div class="sub" id="count"></div><div id="list"></div></div>
</section>
</main>

<script>
const STAMP = "23 Oct 2026, 10:34", ITER = 250000;
/*LOGIC*/
function addDays(iso, n) { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function pickDeck(items, state, today, size = 5) {
  const s = (id) => (state.cards || {})[id];
  const fresh = items.filter((i) => !s(i.id)).sort((a, b) => (b.added || "").localeCompare(a.added || ""));
  const due = items.filter((i) => s(i.id) && s(i.id).due && s(i.id).due <= today && s(i.id).last !== today)
    .sort((a, b) => s(a.id).due.localeCompare(s(b.id).due));
  return [...fresh, ...due].slice(0, size);
}
const LADDER = [1, 3, 7];
function afterSwipe(entry, how, quizRight, today) {
  const e = { ...(entry || {}), last: today };
  if (how === "keep") { e.kept = true; e.due = addDays(today, 3); }
  else if (how === "got") { e.due = addDays(today, 7); }
  else { const box = Math.min(e.box || 0, LADDER.length - 1); e.due = addDays(today, LADDER[box]); e.box = (e.box || 0) + 1; }
  if (quizRight === false) e.due = addDays(today, 1);
  return e;
}
function isWeekend(iso) { const d = new Date(iso + "T00:00:00Z").getUTCDay(); return d === 0 || d === 6; }
function streakAfter(state, today) {
  const last = state.lastDone, s = state.streak || 0;

  let d = addDays(today, -1);

async function open(pw, remember) {
  try {
    const data = await unseal(pw);
    items = Array.isArray(data) ? data : data.items || [];  // older pages sealed a bare list
    morning = Array.isArray(data) ? null : data.morning || null;
  } catch { $("#err").textContent = "That password didn't open it."; try { localStorage.removeItem("distill_pw"); } catch {} return; }
  // Only a failed unseal means a wrong password; a drawing problem must never wipe the saved one.
  try { remember ? localStorage.setItem("distill_pw", pw) : localStorage.removeItem("distill_pw"); } catch {}
  $("#lock").hidden = true; $("#app").hidden = false;
  deck = pickDeck(items, store, today); di = 0; si = 0; phase = "story";
  renderToday(); chips(); renderLibrary();
  if (morning) { $('[data-tab="morning"]').hidden = false; renderMorning(); if (new URLSearchParams(location.search).get("view") === "morning") showTab("morning"); }
}
