<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Distill library</title>
<style>
:root{--bg:#0c0c0e;--card:#16161a;--line:#2a2a30;--text:#ece8de;--muted:#9a927d;--gold:#e2b54a;--ok:#5fbf77;--warn:#e2b54a;--bad:#d9665b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px;color:var(--gold)}.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px}
button{padding:12px 16px;border-radius:10px;border:0;background:var(--gold);color:#16120a;font-weight:600;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:500;font-size:14px}
.chip.on{border-color:var(--gold);color:var(--gold)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.item h2{font-size:16px;margin:0 0 4px}.meta{color:var(--muted);font-size:13px}
.trust{float:right;font-weight:700;font-size:13px;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.more{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.item.open .more{display:block}
.more h3{font-size:14px;color:var(--gold);margin:12px 0 4px}.more ul{margin:4px 0;padding-left:20px}
a{color:var(--gold);word-break:break-all}#lock{margin-top:30vh}.err{color:var(--bad);margin-top:8px}
label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px;margin:10px 0}
</style></head><body><main>
<section id="lock"><h1>Distill</h1><div class="sub">Your library is locked.</div>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<label><input id="remember" type="checkbox" style="width:auto"> Remember on this phone</label>
<button id="open">Open</button><div id="err" class="err"></div></section>
<section id="app" hidden><h1>Distill</h1><div class="sub" id="count"></div>
<input id="q" type="search" placeholder="Search your library"><div class="chips" id="chips"></div><div id="list"></div></section>
</main>

<script>
const STAMP = "16 Oct 2026, 18:21", ITER = 250000;
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const safe = (u) => /^https?:\/\//i.test(u || "") ? u : null;
async function unseal(pw) {
  const raw = Uint8Array.from(atob($("#sealed").textContent.trim()), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: raw.slice(0, 16), iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(16, 28) }, key, raw.slice(28));
  return JSON.parse(new TextDecoder().decode(plain));
}
let items = [], space = "All";
function tone(t) { return t >= 65 ? "ok" : t >= 40 ? "warn" : "bad"; }
function render() {
  const q = $("#q").value.toLowerCase();
  const list = $("#list"); list.replaceChildren();
  const shown = items.filter((i) => (space === "All" || i.space === space) &&
    (!q || JSON.stringify([i.title, i.one_liner, i.summary, i.space, i.steps, (i.tools || []).map((t) => t.name)]).toLowerCase().includes(q)));
  $("#count").textContent = `${shown.length} of ${items.length} cards · updated ${STAMP}`;
  for (const i of shown) {
    const box = el("div", "item");
    if (i.compass) box.append(el("span", "trust " + tone(i.compass.trust), `trust ${i.compass.trust} ± ${i.compass.band}`));
    box.append(el("h2", null, i.one_liner || i.title || ""), el("div", "meta", `${i.space} · ${(i.added || "").slice(0, 10)}`));
    const more = el("div", "more");
    if (i.summary) more.append(el("p", null, i.summary));
    if (i.note) more.append(el("p", "meta", i.note));
    if ((i.claims || []).length) {
      const ok = i.claims.filter((c) => c.verdict === "verified").length;
      more.append(el("h3", null, `What it claims: ${ok} of ${i.claims.length} check out`));
      const ul = el("ul"); for (const c of i.claims) ul.append(el("li", null, `${({ verified: "✅", partial: "◐" })[c.verdict] || "✗"} ${c.claim}`)); more.append(ul);
    }
    if (i.compass) {
      const why = ({ teach: "to teach", sell: "to sell", engagement: "for engagement" })[i.compass.intent] || "for unclear reasons";
      more.append(el("h3", null, `🧭 Made ${why}${i.compass.mixed ? " (mixed motives)" : ""}`));
      const ul = el("ul"); for (const b of i.compass.because || []) ul.append(el("li", null, b)); more.append(ul);
    }
    if ((i.steps || []).length) { more.append(el("h3", null, "Steps")); const ol = el("ol"); for (const s of i.steps) ol.append(el("li", null, s)); more.append(ol); }
    const links = (i.tools || []).filter((t) => safe(t.url));
    if (links.length) { more.append(el("h3", null, "Links")); const ul = el("ul"); for (const t of links) { const li = el("li"); const a = el("a", null, t.name); a.href = safe(t.url); a.target = "_blank"; a.rel = "noopener"; li.append(a); ul.append(li); } more.append(ul); }
    if (i.next_time) more.append(el("p", null, "Next time: " + i.next_time));
    if (safe(i.url)) { const a = el("a", null, "Open the original"); a.href = safe(i.url); a.target = "_blank"; a.rel = "noopener"; more.append(a); }
    box.append(more);
    box.addEventListener("click", (e) => { if (e.target.tagName !== "A") box.classList.toggle("open"); });
    list.append(box);
  }
}
function chips() {
  const names = ["All", ...new Set(items.map((i) => i.space))];
  const c = $("#chips"); c.replaceChildren();
  for (const n of names) { const b = el("button", "chip" + (n === space ? " on" : ""), n); b.onclick = () => { space = n; chips(); render(); }; c.append(b); }
}
async function open(pw, remember) {
  try {
    items = await unseal(pw);
    try { remember ? localStorage.setItem("distill_pw", pw) : localStorage.removeItem("distill_pw"); } catch {}
    $("#lock").hidden = true; $("#app").hidden = false; chips(); render();
  } catch { $("#err").textContent = "That password didn't open it."; try { localStorage.removeItem("distill_pw"); } catch {} }
}
$("#open").onclick = () => open($("#pw").value, $("#remember").checked);
$("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#open").click(); });
$("#q").addEventListener("input", render);
try { const saved = localStorage.getItem("distill_pw"); if (saved) open(saved, true); } catch {}
</script></body></html>
